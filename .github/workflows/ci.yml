name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check rapido tests scripts
      - run: ruff format --check rapido tests scripts
      - run: pytest -q

  container:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: rapido:ci
      - run: docker run --rm --platform ${{ matrix.platform }} --entrypoint codex rapido:ci --version
      - run: docker inspect rapido:ci --format '{{json .Architecture}} {{json .Config.User}} {{json .Config.Entrypoint}}'
      - run: >-
          docker run --rm --init --network none --hostname localhost
          --platform ${{ matrix.platform }}
          --cpus=2 --memory=6g --memory-swap=6g --pids-limit=256
          --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev --cap-drop=ALL
          --security-opt=no-new-privileges:true
          --mount type=bind,src="$PWD/scripts/tooling_acceptance.py",dst=/tmp/tooling_acceptance.py,readonly
          --entrypoint /opt/venv/bin/python rapido:ci /tmp/tooling_acceptance.py
