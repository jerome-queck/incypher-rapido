name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff
      - run: ruff check rapido tests scripts
      - run: ruff format --check rapido tests scripts
      - run: pytest -q

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: ${{ matrix.platform == 'linux/amd64' }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: rapido:ci
      - if: matrix.platform == 'linux/amd64'
        run: docker run --rm --entrypoint codex rapido:ci --version
      - if: matrix.platform == 'linux/amd64'
        run: docker inspect rapido:ci --format '{{json .Config.User}} {{json .Config.Entrypoint}}'
      - if: matrix.platform == 'linux/amd64'
        run: >-
          docker run --rm --init --network none --cpus=1 --memory=1g --pids-limit=128
          --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev --cap-drop=ALL
          --security-opt=no-new-privileges:true
          --mount type=bind,src="$PWD/scripts/tooling_acceptance.py",dst=/tmp/tooling_acceptance.py,readonly
          --entrypoint /opt/venv/bin/python rapido:ci /tmp/tooling_acceptance.py
