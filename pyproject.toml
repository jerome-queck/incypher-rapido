[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incypher-rapido"
version = "0.1.0"
description = "Autonomous native-Codex agent for bounded IN-CYPHER challenge solving"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rapido = "rapido.cli:main"

[tool.setuptools.packages.find]
include = ["rapido*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
