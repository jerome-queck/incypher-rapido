[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incypher-rapido"
version = "0.1.0"
description = "Autonomous native-Codex agent for bounded IN-CYPHER challenge solving"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "Pillow==12.2.0",
    "capstone==5.0.9",
    "cryptography==50.0.1",
    "dpkt==1.9.8",
    "gmpy2==2.2.1",
    "httpx[http2]==0.28.1",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "pefile==2024.8.26",
    "pypdf==6.18.1",
    "pwntools==4.15.0",
    "pycryptodome==3.23.0",
    "pyelftools==0.33",
    "requests==2.34.2",
    "sympy==1.14.0",
    "unicorn==2.1.2",
    "z3-solver==4.15.4.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema==4.25.1",
    "pytest",
    "ruff",
]

[project.scripts]
rapido = "rapido.cli:main"

[tool.setuptools.packages.find]
include = ["rapido*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
