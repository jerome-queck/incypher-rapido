[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incypher-rapido"
version = "0.1.0"
description = "Autonomous native-Codex agent for bounded IN-CYPHER challenge solving"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "Pillow==12.2.0",
    "capstone==5.0.9",
    "dpkt==1.9.8",
    "pefile==2024.8.26",
    "pypdf==6.18.1",
]

[project.scripts]
rapido = "rapido.cli:main"

[tool.setuptools.packages.find]
include = ["rapido*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
